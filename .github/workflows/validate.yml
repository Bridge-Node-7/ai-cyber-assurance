name: Validate repository

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run validator regression tests
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check deterministic release metadata
        shell: bash
        run: python scripts/refresh_release_metadata.py --root . --check

      - name: Validate release package
        shell: bash
        run: |
          command -v sha256sum
          python scripts/validate_repo.py             --root .             --json-output validation-report.json
          sha256sum -c MANIFEST.sha256
          git diff --check

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-cyber-assurance-validation-${{ matrix.os }}
          path: validation-report.json
          if-no-files-found: error
          retention-days: 30
